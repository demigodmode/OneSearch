[project]
name = "onesearch-agent"
version = "1.3.0"
description = "Secure remote indexing agent for OneSearch"
requires-python = ">=3.10"
dependencies = [
    "onesearch-shared",
    "onesearch-backend",
    "click>=8",
    "httpx>=0.25",
    "pydantic>=2,<3",
    "keyring>=24",
    "platformdirs>=4",
    "tomli>=2; python_version < '3.11'",
    "pywin32>=306; sys_platform == 'win32'",
    "cryptography>=43",
]

[project.scripts]
onesearch-agent = "onesearch_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onesearch_agent"]

[tool.hatch.build]
include = ["onesearch_agent/release_public_key.txt", "onesearch_agent/onesearch-agent.service"]
