[project]
name = "onesearch-agent"
version = "1.7.0"
description = "Secure remote indexing agent for OneSearch"
requires-python = ">=3.11"
dependencies = [
    "onesearch-shared",
    "onesearch-backend",
    # Protect standalone agent upgrades that retain an older installed backend.
    "pillow>=13.0.0",
    "pypdf>=6.21.2",
    "certifi>=2026.10.19",
    "click>=8",
    "httpx>=0.25",
    "pydantic>=2,<3",
    "keyring>=24",
    "platformdirs>=4",
    "tomli>=2; python_version < '3.11'",
    "pywin32>=306; sys_platform == 'win32'",
    "cryptography>=43",
]

[project.scripts]
onesearch-agent = "onesearch_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onesearch_agent"]

[tool.hatch.build]
include = ["onesearch_agent/release_public_key.txt", "onesearch_agent/onesearch-agent.service"]
