[project]
name = "onesearch-shared"
version = "1.4.0"
description = "Versioned wire contracts shared by OneSearch servers and remote agents"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onesearch_shared"]

# Tool config inherited from root pyproject.toml
