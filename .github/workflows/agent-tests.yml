name: Agent tests

on:
  pull_request:
    paths:
      - "agent/**"
      - "shared/**"
      - "backend/**"
      - ".github/workflows/agent-tests.yml"
      - ".github/workflows/agent-release.yml"
      - "agent/Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main, feat/remote-indexing-agents]
    paths:
      - "agent/**"
      - "shared/**"
      - "backend/**"
      - ".github/workflows/agent-tests.yml"
      - ".github/workflows/agent-release.yml"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-packages --group dev
      - run: uv run pytest agent/tests backend/tests/test_dockerfile.py -v
