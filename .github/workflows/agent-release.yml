name: Release OneSearch Agent

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version (without leading v)
        required: true

permissions:
  contents: write
  packages: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    env:
      AGENT_UPDATE_PUBLIC_KEY: ${{ secrets.AGENT_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Embed release public key
        shell: bash
        run: |
          test -n "$AGENT_UPDATE_PUBLIC_KEY" || { echo "AGENT_UPDATE_PUBLIC_KEY is required" >&2; exit 1; }
          printf '%s\n' "$AGENT_UPDATE_PUBLIC_KEY" > agent/onesearch_agent/release_public_key.txt
      - run: uv run --with pyinstaller pyinstaller agent/packaging/onesearch-agent.spec
      - name: Name native assets deterministically
        shell: bash
        run: |
          mkdir -p "dist/onesearch-agent-${{ matrix.target }}"
          ext=""
          if [ "${{ matrix.target }}" = "win32-x64" ]; then ext=".exe"; fi
          mv "dist/onesearch-agent$ext" "dist/onesearch-agent-${{ matrix.target }}/onesearch-agent-${{ matrix.target }}$ext"
          mv "dist/onesearch-agent-updater$ext" "dist/onesearch-agent-${{ matrix.target }}/onesearch-agent-updater-${{ matrix.target }}$ext"
      - uses: actions/upload-artifact@v7
        with:
          name: onesearch-agent-${{ matrix.target }}
          path: dist/onesearch-agent*

  publish:
    needs: native
    runs-on: ubuntu-latest
    env:
      AGENT_UPDATE_PRIVATE_KEY: ${{ secrets.AGENT_UPDATE_PRIVATE_KEY }}
      AGENT_UPDATE_PUBLIC_KEY: ${{ secrets.AGENT_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Sign checksums and manifests
        shell: bash
        run: |
          test -n "$AGENT_UPDATE_PRIVATE_KEY" && test -n "$AGENT_UPDATE_PUBLIC_KEY" || { echo "both update keys are required" >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"; [ "${GITHUB_EVENT_NAME}" = release ] || version="${{ inputs.version }}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "valid semver version required" >&2; exit 1; }
          uv run --package onesearch-agent python -c 'import base64,os; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; p=Ed25519PrivateKey.from_private_bytes(base64.b64decode(os.environ["AGENT_UPDATE_PRIVATE_KEY"],validate=True)).public_key().public_bytes_raw(); assert p == base64.b64decode(os.environ["AGENT_UPDATE_PUBLIC_KEY"],validate=True), "public key mismatch"'
          for platform in linux-amd64 linux-arm64 win32-x64; do
            artifact="dist/onesearch-agent-$platform/onesearch-agent-$platform$([ "$platform" = win32-x64 ] && printf .exe)"
            uv run --package onesearch-agent python agent/packaging/make_manifest.py \
              --artifact "$artifact" --platform "$platform" --version "$version" \
              --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/$(basename "$artifact")" \
              --private-key "$AGENT_UPDATE_PRIVATE_KEY" --output "dist/agent-manifest-${platform}.json"
          done
          find dist -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: dist/**

  image:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/onesearch-agent
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ (github.event.release.tag_name || inputs.version || 'manual') && (github.event.release.tag_name || inputs.version || 'manual') }}
      - uses: docker/build-push-action@v7
        if: github.event_name == 'release' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/onesearch-agent:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/onesearch-agent:${{ github.event.release.tag_name }}
