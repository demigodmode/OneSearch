name: Release OneSearch Agent

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
      version:
        description: SemVer version without a leading v
        required: true
      publish:
        description: Publish images (release assets are release-event only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = release ]; then
            tag="$RELEASE_TAG"
            [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "release tag must be vX.Y.Z" >&2; exit 1; }
            version="${BASH_REMATCH[1]}"
          else
            version="$INPUT_VERSION"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "strict X.Y.Z version required" >&2; exit 1; }
            tag="v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  validate:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Verify checked-out validation sources
        shell: bash
        run: uv run python scripts/verify_release_version.py "${{ inputs.version }}"
      - run: uv run --with pyinstaller pyinstaller agent/packaging/onesearch-agent.spec
      - name: Stage collision-free native assets
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release-assets
          ext=""; [ "$TARGET" = win32-x64 ] && ext=.exe
          label="$TARGET"; [ "$TARGET" = win32-x64 ] && label=windows-x64
          mv "dist/onesearch-agent$ext" "release-assets/onesearch-agent-$VERSION-$label$ext"
          mv "dist/onesearch-agent-updater$ext" "release-assets/onesearch-agent-updater-$VERSION-$label$ext"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: release-assets/*
      - name: Summarize validation-only build
        shell: bash
        env:
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          echo "### Validation-only agent build" >> "$GITHUB_STEP_SUMMARY"
          echo "No registry or release publication occurred." >> "$GITHUB_STEP_SUMMARY"
          if [ "$REQUESTED_PUBLISH" = true ]; then
            echo "The requested publish option was ignored." >> "$GITHUB_STEP_SUMMARY"
          fi

  release-native:
    needs: meta
    if: github.event_name == 'release'
    permissions:
      contents: read
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    env:
      AGENT_UPDATE_PUBLIC_KEY: ${{ secrets.AGENT_UPDATE_PUBLIC_KEY }}
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Verify immutable release tag and source versions
        shell: bash
        run: |
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          [ "$tag_commit" = "$GITHUB_SHA" ] || { echo "release tag does not resolve to the release event SHA" >&2; exit 1; }
          uv run python scripts/verify_release_version.py "$VERSION"
      - name: Validate and embed release public key
        shell: bash
        run: |
          uv run --package onesearch-agent python -c 'from onesearch_agent.packaging import validate_public_key; import os; validate_public_key(os.environ["AGENT_UPDATE_PUBLIC_KEY"])'
          printf '%s\n' "$AGENT_UPDATE_PUBLIC_KEY" > agent/onesearch_agent/release_public_key.txt
      - run: uv run --with pyinstaller pyinstaller agent/packaging/onesearch-agent.spec
      - name: Stage collision-free native assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release-assets
          ext=""; [ "$TARGET" = win32-x64 ] && ext=.exe
          label="$TARGET"; [ "$TARGET" = win32-x64 ] && label=windows-x64
          mv "dist/onesearch-agent$ext" "release-assets/onesearch-agent-$VERSION-$label$ext"
          mv "dist/onesearch-agent-updater$ext" "release-assets/onesearch-agent-updater-$VERSION-$label$ext"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: release-assets/*

  release-publish:
    needs: [meta, release-native]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      AGENT_UPDATE_PRIVATE_KEY: ${{ secrets.AGENT_UPDATE_PRIVATE_KEY }}
      AGENT_UPDATE_PUBLIC_KEY: ${{ secrets.AGENT_UPDATE_PUBLIC_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Verify immutable release tag and source versions
        shell: bash
        run: |
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          tag_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          [ "$tag_commit" = "$GITHUB_SHA" ] || { echo "release tag does not resolve to the release event SHA" >&2; exit 1; }
          uv run python scripts/verify_release_version.py "$VERSION"
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: native-*
          merge-multiple: true
      - name: Create signed manifests and checksums
        shell: bash
        run: |
          uv run --package onesearch-agent python -c 'from onesearch_agent.packaging import verify_key_pair; import os; verify_key_pair(os.environ["AGENT_UPDATE_PRIVATE_KEY"], os.environ["AGENT_UPDATE_PUBLIC_KEY"])'
          for platform in linux-amd64 linux-arm64 win32-x64; do
            label="$platform"; ext=""; [ "$platform" = win32-x64 ] && label=windows-x64 && ext=.exe
            artifact="release-assets/onesearch-agent-$VERSION-$label$ext"
            uv run --package onesearch-agent python agent/packaging/make_manifest.py --artifact "$artifact" --platform "$platform" --version "$VERSION" --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$artifact")" --private-key "$AGENT_UPDATE_PRIVATE_KEY" --output "release-assets/agent-manifest-$platform.json"
          done
          uv run --package onesearch-agent python -c 'from pathlib import Path; from onesearch_agent.packaging import checksum_lines; path=Path("release-assets/SHA256SUMS"); path.write_text("\n".join(checksum_lines(path.parent))+"\n")'
          uv run --package onesearch-agent python agent/packaging/sign_checksums.py --input release-assets/SHA256SUMS --private-key "$AGENT_UPDATE_PRIVATE_KEY" --output release-assets/SHA256SUMS.sig
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@v4
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Publish agent image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            AGENT_UPDATE_PUBLIC_KEY=${{ env.AGENT_UPDATE_PUBLIC_KEY }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/onesearch-agent:${{ needs.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/onesearch-agent:latest
      - uses: docker/build-push-action@v7
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            AGENT_UPDATE_PUBLIC_KEY=${{ env.AGENT_UPDATE_PUBLIC_KEY }}
          push: true
          tags: |
            docker.io/${{ env.DOCKERHUB_USERNAME }}/onesearch-agent:${{ needs.meta.outputs.version }}
            docker.io/${{ env.DOCKERHUB_USERNAME }}/onesearch-agent:latest
