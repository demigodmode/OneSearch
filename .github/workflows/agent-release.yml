name: Release OneSearch Agent

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
      version:
        description: SemVer version without a leading v
        required: true
      publish:
        description: Publish images (release assets are release-event only)
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  packages: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish_images: ${{ steps.version.outputs.publish_images }}
    steps:
      - id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          tag="$RELEASE_TAG"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then tag="v$INPUT_VERSION"; fi
          version="${tag#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "strict X.Y.Z version required" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = release ] || [ "$INPUT_PUBLISH" = true ]; then echo "publish_images=true" >> "$GITHUB_OUTPUT"; else echo "publish_images=false" >> "$GITHUB_OUTPUT"; fi

  native:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    env:
      AGENT_UPDATE_PUBLIC_KEY: ${{ secrets.AGENT_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Validate and embed release public key
        shell: bash
        run: |
          uv run --package onesearch-agent python -c 'import base64, os; key=base64.b64decode(os.environ["AGENT_UPDATE_PUBLIC_KEY"], validate=True); assert len(key) == 32, "public key must be raw 32 bytes"'
          printf '%s\n' "$AGENT_UPDATE_PUBLIC_KEY" > agent/onesearch_agent/release_public_key.txt
      - run: uv run --with pyinstaller pyinstaller agent/packaging/onesearch-agent.spec
      - name: Stage collision-free native assets
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release-assets
          ext=""; [ "$TARGET" = win32-x64 ] && ext=.exe
          label="$TARGET"; [ "$TARGET" = win32-x64 ] && label=windows-x64
          mv "dist/onesearch-agent$ext" "release-assets/onesearch-agent-$VERSION-$label$ext"
          mv "dist/onesearch-agent-updater$ext" "release-assets/onesearch-agent-updater-$VERSION-$label$ext"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: release-assets/*

  publish:
    needs: [meta, native]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      AGENT_UPDATE_PRIVATE_KEY: ${{ secrets.AGENT_UPDATE_PRIVATE_KEY }}
      AGENT_UPDATE_PUBLIC_KEY: ${{ secrets.AGENT_UPDATE_PUBLIC_KEY }}
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: native-*
          merge-multiple: true
      - name: Create signed manifests and checksums
        shell: bash
        run: |
          uv run --package onesearch-agent python -c 'from onesearch_agent.packaging import verify_key_pair; import os; verify_key_pair(os.environ["AGENT_UPDATE_PRIVATE_KEY"], os.environ["AGENT_UPDATE_PUBLIC_KEY"])'
          for platform in linux-amd64 linux-arm64 win32-x64; do
            label="$platform"; ext=""; [ "$platform" = win32-x64 ] && label=windows-x64 && ext=.exe
            artifact="release-assets/onesearch-agent-$VERSION-$label$ext"
            uv run --package onesearch-agent python agent/packaging/make_manifest.py --artifact "$artifact" --platform "$platform" --version "$VERSION" --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$artifact")" --private-key "$AGENT_UPDATE_PRIVATE_KEY" --output "release-assets/agent-manifest-$platform.json"
          done
          uv run --package onesearch-agent python -c 'from pathlib import Path; from onesearch_agent.packaging import checksum_lines; path=Path("release-assets/SHA256SUMS"); path.write_text("\n".join(checksum_lines(path.parent))+"\n")'
          uv run --package onesearch-agent python agent/packaging/sign_checksums.py --input release-assets/SHA256SUMS --private-key "$AGENT_UPDATE_PRIVATE_KEY" --output release-assets/SHA256SUMS.sig
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: release-assets/*

  image:
    needs: meta
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PUBLISH: ${{ needs.meta.outputs.publish_images }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.meta.outputs.publish_images == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/onesearch-agent:${{ needs.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/onesearch-agent:latest
      - uses: docker/build-push-action@v7
        if: env.PUBLISH == 'true' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/onesearch-agent:${{ needs.meta.outputs.version }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/onesearch-agent:latest
