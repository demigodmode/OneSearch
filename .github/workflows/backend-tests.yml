name: Backend + CLI CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'cli/**'
      - 'shared/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    name: ${{ matrix.python == '3.13' && 'test' || format('test (Python {0})', matrix.python) }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}

    services:
      meilisearch:
        image: getmeili/meilisearch:v1.12
        ports:
          - 7700:7700
        env:
          MEILI_MASTER_KEY: test-master-key
          MEILI_ENV: development
        options: >-
          --health-cmd="wget --no-verbose --spider http://127.0.0.1:7700/health || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@v5
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-python-${{ matrix.python }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock', 'agent/pyproject.toml', 'backend/pyproject.toml', 'cli/pyproject.toml', 'shared/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ matrix.python }}-uv-

      - name: Install workspace dependencies
        run: |
          uv sync --frozen --all-extras --all-groups

      - name: Run backend tests
        env:
          MEILI_URL: http://127.0.0.1:7700
          MEILI_MASTER_KEY: test-master-key
        run: |
          uv run --frozen pytest backend/tests/ -v --tb=short --color=yes --cov=app

      - name: Run CLI tests
        run: |
          uv run --frozen pytest cli/tests/ -v --tb=short --color=yes

      - name: Run shared tests
        run: |
          uv run --frozen pytest shared/tests/ -v --tb=short --color=yes

      - name: Build onesearch-cli package
        if: matrix.python == '3.13'
        run: |
          uv run --frozen --with build python -m build cli

      - name: Upload onesearch-cli artifacts
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: onesearch-cli-dist
          path: cli/dist/*

