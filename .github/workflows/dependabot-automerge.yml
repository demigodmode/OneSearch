name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      # only patch/minor bumps of app deps. majors and actions updates get a manual look,
      # and anything fetch-metadata can't classify is left alone
      - name: Enable auto-merge
        if: >-
          contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.meta.outputs.update-type)
          && contains(fromJSON('["npm_and_yarn", "uv", "pip"]'), steps.meta.outputs.package-ecosystem)
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
